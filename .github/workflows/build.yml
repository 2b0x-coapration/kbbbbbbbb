name: Build SUPERGO installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    env:
      PFX_BASE64: ${{ secrets.PFX_BASE64 }}
      PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.22' }
      - name: Build
        shell: pwsh
        run: |
          go install github.com/tc-hib/go-winres@latest
          & "$(go env GOPATH)\bin\go-winres" make --in winres.json --arch amd64,386
          $env:GOOS='windows'
          $env:GOARCH='amd64'; go build -ldflags "-H windowsgui -s -w" -o SUPERGO-Setup-2_0_0.exe .
          $env:GOARCH='386';   go build -ldflags "-H windowsgui -s -w" -o SUPERGO-Setup-2_0_0-x86.exe .
      - name: Sign (only if you added the secrets)
        if: ${{ env.PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes('cert.pfx',[Convert]::FromBase64String($env:PFX_BASE64))
          $st=(Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -like '*x64*' | Select-Object -First 1).FullName
          Get-ChildItem SUPERGO-Setup-*.exe | ForEach-Object { & $st sign /f cert.pfx /p $env:PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName }
          Remove-Item cert.pfx
      - uses: actions/upload-artifact@v4
        with:
          name: SUPERGO-Setup
          path: SUPERGO-Setup-*.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SUPERGO-Setup-*.exe
